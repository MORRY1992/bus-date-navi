<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Temporary branch-only QA"><link rel="canonical" href="https://bus-date-navi.pages.dev/"><meta name="robots" content="noindex,nofollow"><title>Zone4 QA</title><link rel="stylesheet" href="/__qa.css"><script defer src="/__qa.mjs"></script></head><body><h1>Zone4 Browser QA · 合成入力のみ</h1><p><button id="run">Run regression</button> <label>幅 <select id="width"><option>390</option><option>375</option><option>320</option><option>1280</option></select></label> <button id="guide">ガイド</button><button id="home">TOP</button><button id="zoom">文字・レイアウト200%</button><button id="result-view">結果を表示</button><button id="error-view">エラーを表示</button></p><pre id="report">未実行</pre><iframe id="preview" title="検査画面" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;ja&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1,viewport-fit=cover&quot;&gt;&lt;title&gt;夜行バスの24時・25時は何日？｜日付まちがい防止ナビ&lt;/title&gt;&lt;meta name=&quot;description&quot; content=&quot;夜行バスの24時・25時表記を日本時間の実際の日時に換算。乗車日と到着・ホテル予定の時間差を無料で確認。登録不要、入力した予定は端末内で処理します。&quot;&gt;&lt;meta name=&quot;google-site-verification&quot; content=&quot;EuNEpBZmHEmdZQ6MrhX1X6HME4LkcC5O2_vVCpQmz54&quot;&gt;&lt;meta name=&quot;theme-color&quot; content=&quot;#162f50&quot;&gt;&lt;link rel=&quot;canonical&quot; href=&quot;https://bus-date-navi.pages.dev/&quot;&gt;&lt;meta property=&quot;og:type&quot; content=&quot;website&quot;&gt;&lt;meta property=&quot;og:title&quot; content=&quot;夜行バスの24時・25時は何日？｜日付まちがい防止ナビ&quot;&gt;&lt;meta property=&quot;og:description&quot; content=&quot;夜行バスの24時・25時表記を日本時間の実際の日時に換算。乗車日と到着・ホテル予定の時間差を無料で確認。登録不要、入力した予定は端末内で処理します。&quot;&gt;&lt;meta property=&quot;og:url&quot; content=&quot;https://bus-date-navi.pages.dev/&quot;&gt;&lt;meta property=&quot;og:locale&quot; content=&quot;ja_JP&quot;&gt;&lt;meta name=&quot;twitter:card&quot; content=&quot;summary&quot;&gt;&lt;meta name=&quot;google-adsense-account&quot; content=&quot;ca-pub-2422278081062267&quot;&gt;&lt;link rel=&quot;icon&quot; href=&quot;/icon.svg&quot; type=&quot;image/svg+xml&quot;&gt;&lt;link rel=&quot;stylesheet&quot; href=&quot;/style.css&quot;&gt;&lt;script type=&quot;module&quot; src=&quot;/app.mjs&quot;&gt;&lt;/script&gt;&lt;/head&gt;&lt;body&gt;&lt;a class=&quot;skip&quot; href=&quot;#main&quot;&gt;本文へ移動&lt;/a&gt;&lt;header class=&quot;site-header&quot;&gt;&lt;a class=&quot;brand&quot; href=&quot;/&quot;&gt;&lt;span class=&quot;brand-mark&quot; aria-hidden=&quot;true&quot;&gt;☾&lt;/span&gt;&lt;span&gt;日付まちがい防止ナビ&lt;small&gt;NIGHT BUS · DATE CHECK&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;nav aria-label=&quot;メイン&quot;&gt;&lt;a href=&quot;/guide&quot;&gt;日付の読み方&lt;/a&gt;&lt;span class=&quot;free&quot;&gt;無料・登録不要&lt;/span&gt;&lt;/nav&gt;&lt;/header&gt;&lt;main id=&quot;main&quot;&gt;&lt;section class=&quot;hero&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;夜行バス・遠征の出発前に&lt;/p&gt;&lt;h1&gt;24時を過ぎたら、&lt;br&gt;&lt;span&gt;何日の何時？&lt;/span&gt;&lt;/h1&gt;&lt;p class=&quot;hero-lead&quot;&gt;予約画面の表記を、カレンダーの日時へ。&lt;/p&gt;&lt;div class=&quot;hero-tags&quot;&gt;&lt;span&gt;00:00〜29:59対応&lt;/span&gt;&lt;span&gt;日本時間・端末内で計算&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;boundary-example&quot;&gt;&lt;figcaption&gt;&lt;span class=&quot;example-label&quot;&gt;表記の例&lt;/span&gt; 7日24:20 ＝ 暦の8日0:20&lt;/figcaption&gt;&lt;div class=&quot;day-strip&quot;&gt;&lt;div&gt;&lt;span&gt;7日・夜&lt;/span&gt;&lt;strong&gt;23:59&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;midnight&quot;&gt;&lt;span&gt;日付が変わる&lt;/span&gt;&lt;strong&gt;8日 0:00&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;destination&quot;&gt;&lt;span&gt;7日24:20 のこと&lt;/span&gt;&lt;strong&gt;8日 0:20&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;時刻の順序を示す図です。間隔は時間に比例しません。&lt;/p&gt;&lt;/figure&gt;&lt;/section&gt;
&lt;div class=&quot;important-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;表記の変換ツールです。&lt;/strong&gt; 予約に選ぶ日付・便の運行日は予約元で確認してください。&lt;/p&gt;&lt;a href=&quot;#input-title&quot;&gt;自分の日時を確認 ↓&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;workspace&quot;&gt;&lt;section class=&quot;panel input-panel&quot; aria-labelledby=&quot;input-title&quot;&gt;&lt;div class=&quot;section-heading&quot;&gt;&lt;span class=&quot;step&quot;&gt;01&lt;/span&gt;&lt;h2 id=&quot;input-title&quot;&gt;予約画面の表記を入力&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;購入手続きした日ではなく、予約詳細にある出発日です。&lt;/p&gt;&lt;form id=&quot;check-form&quot; novalidate&gt;&lt;fieldset&gt;&lt;legend&gt;出発日時 &lt;span class=&quot;required&quot;&gt;必須&lt;/span&gt;&lt;/legend&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;departureDate&quot;&gt;表示されている出発日&lt;/label&gt;&lt;input id=&quot;departureDate&quot; name=&quot;departureDate&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：2026/11/07&quot; maxlength=&quot;24&quot; aria-describedby=&quot;departureDate-hint departureDate-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;departureDate-hint&quot;&gt;年/月/日、または年-月-日。全角でも入力できます。&lt;/small&gt;&lt;p id=&quot;departureDate-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;details class=&quot;date-picker&quot;&gt;&lt;summary&gt;カレンダーから選ぶ&lt;/summary&gt;&lt;label for=&quot;departureDate-picker&quot;&gt;表示されている出発日を選択&lt;/label&gt;&lt;input id=&quot;departureDate-picker&quot; type=&quot;date&quot; min=&quot;1900-01-01&quot; max=&quot;9998-12-31&quot; aria-describedby=&quot;departureDate-hint&quot;&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;date-shortcuts&quot;&gt;&lt;button id=&quot;use-today&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;日本時間の今日&lt;/button&gt;&lt;button id=&quot;use-tomorrow&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;日本時間の明日&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;departureTime&quot;&gt;表示されている出発時刻&lt;/label&gt;&lt;input id=&quot;departureTime&quot; name=&quot;departureTime&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：24:20&quot; maxlength=&quot;24&quot; aria-describedby=&quot;departureTime-hint departureTime-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;departureTime-hint&quot;&gt;00:00〜29:59。「翌日」の注記があるときは予約元で確認。&lt;/small&gt;&lt;p id=&quot;departureTime-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;/div&gt;&lt;/fieldset&gt;&lt;details class=&quot;sample-options&quot;&gt;&lt;summary&gt;入力例を試す&lt;/summary&gt;&lt;div class=&quot;sample-line&quot;&gt;&lt;button id=&quot;sample&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;入力例を試す：11/7 24:20&lt;/button&gt;&lt;button id=&quot;sample-year&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;年越し：12/31 25:10&lt;/button&gt;&lt;button id=&quot;sample-hotel&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;到着→ホテルの8時間待ち&lt;/button&gt;&lt;span id=&quot;sample-notice&quot; hidden&gt;入力例です。ご自身の予約に置き換えてください。&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;optional&quot;&gt;&lt;summary&gt;到着・ホテルの日程も確認する &lt;span&gt;任意&lt;/span&gt;&lt;/summary&gt;&lt;p class=&quot;muted&quot;&gt;こちらはカレンダー上の日付・00〜23時表記で入力します。分からない場合は空欄で構いません。&lt;/p&gt;&lt;fieldset&gt;&lt;legend&gt;バスの到着予定&lt;/legend&gt;&lt;button id=&quot;arrival-use-departure&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;換算後の出発日を到着日の仮入力に使う&lt;/button&gt;&lt;div class=&quot;optional-grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;arrivalDate&quot;&gt;到着予定日&lt;/label&gt;&lt;input id=&quot;arrivalDate&quot; name=&quot;arrivalDate&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：2026/11/08&quot; maxlength=&quot;24&quot; aria-describedby=&quot;arrivalDate-hint arrivalDate-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;arrivalDate-hint&quot;&gt;実際のカレンダー日付&lt;/small&gt;&lt;p id=&quot;arrivalDate-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;details class=&quot;date-picker&quot;&gt;&lt;summary&gt;カレンダーから選ぶ&lt;/summary&gt;&lt;label for=&quot;arrivalDate-picker&quot;&gt;到着予定日を選択&lt;/label&gt;&lt;input id=&quot;arrivalDate-picker&quot; type=&quot;date&quot; min=&quot;1900-01-01&quot; max=&quot;9998-12-31&quot; aria-describedby=&quot;arrivalDate-hint&quot;&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;arrivalTime&quot;&gt;到着予定時刻&lt;/label&gt;&lt;input id=&quot;arrivalTime&quot; name=&quot;arrivalTime&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：07:00&quot; maxlength=&quot;24&quot; aria-describedby=&quot;arrivalTime-hint arrivalTime-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;arrivalTime-hint&quot;&gt;00:00〜23:59&lt;/small&gt;&lt;p id=&quot;arrivalTime-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/fieldset&gt;&lt;fieldset&gt;&lt;legend&gt;ホテルのチェックイン予定&lt;/legend&gt;&lt;button id=&quot;hotel-use-arrival&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;入力した到着日をホテル予定日に使う&lt;/button&gt;&lt;div class=&quot;optional-grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;hotelDate&quot;&gt;チェックイン予定日&lt;/label&gt;&lt;input id=&quot;hotelDate&quot; name=&quot;hotelDate&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：2026/11/08&quot; maxlength=&quot;24&quot; aria-describedby=&quot;hotelDate-hint hotelDate-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;hotelDate-hint&quot;&gt;予約した宿泊日の確認も必要&lt;/small&gt;&lt;p id=&quot;hotelDate-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;details class=&quot;date-picker&quot;&gt;&lt;summary&gt;カレンダーから選ぶ&lt;/summary&gt;&lt;label for=&quot;hotelDate-picker&quot;&gt;チェックイン予定日を選択&lt;/label&gt;&lt;input id=&quot;hotelDate-picker&quot; type=&quot;date&quot; min=&quot;1900-01-01&quot; max=&quot;9998-12-31&quot; aria-describedby=&quot;hotelDate-hint&quot;&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;hotelTime&quot;&gt;チェックイン予定時刻&lt;/label&gt;&lt;input id=&quot;hotelTime&quot; name=&quot;hotelTime&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：15:00&quot; maxlength=&quot;24&quot; aria-describedby=&quot;hotelTime-hint hotelTime-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;hotelTime-hint&quot;&gt;00:00〜23:59&lt;/small&gt;&lt;p id=&quot;hotelTime-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/fieldset&gt;&lt;/details&gt;&lt;p id=&quot;date-input-status&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;div id=&quot;form-error&quot; class=&quot;error&quot; role=&quot;alert&quot; hidden&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; type=&quot;submit&quot;&gt;乗車日時を確認する &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;reset&quot; id=&quot;clear-input&quot; type=&quot;button&quot;&gt;入力をすべて消す&lt;/button&gt;&lt;p class=&quot;local-note&quot;&gt;予約番号・名前の入力は不要。&lt;br&gt;このフォームの予定は外部へ送信しません。&lt;/p&gt;&lt;/form&gt;&lt;noscript&gt;&lt;p class=&quot;error&quot;&gt;計算にはJavaScriptを有効にしてください。日付の読み方は下のガイドで確認できます。&lt;/p&gt;&lt;/noscript&gt;&lt;/section&gt;
&lt;section class=&quot;panel result-panel&quot; aria-label=&quot;確認結果&quot;&gt;&lt;div class=&quot;section-heading&quot;&gt;&lt;span class=&quot;step light&quot;&gt;02&lt;/span&gt;&lt;h2&gt;カレンダー上の日時を確認&lt;/h2&gt;&lt;/div&gt;&lt;div id=&quot;empty-result&quot; class=&quot;empty-result&quot;&gt;&lt;span class=&quot;empty-mark&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;h3&gt;ご自身の日時は、まだ未計算です&lt;/h3&gt;&lt;p&gt;出発日と時刻を入力し、&lt;br&gt;「乗車日時を確認する」を押してください。&lt;/p&gt;&lt;p class=&quot;empty-note&quot;&gt;上の時刻帯は説明用の例です。&lt;/p&gt;&lt;/div&gt;
&lt;div id=&quot;result&quot; hidden&gt;&lt;p id=&quot;result-kind&quot; class=&quot;result-kind&quot;&gt;&lt;/p&gt;&lt;p class=&quot;result-input&quot;&gt;予約画面の入力 &lt;strong id=&quot;input-summary&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;div class=&quot;actual&quot;&gt;&lt;span id=&quot;rollover&quot; class=&quot;rollover&quot;&gt;&lt;/span&gt;&lt;h3 id=&quot;result-title&quot; tabindex=&quot;-1&quot;&gt;カレンダー上の出発日時&lt;/h3&gt;&lt;div id=&quot;actual-date&quot; class=&quot;actual-date&quot;&gt;&lt;/div&gt;&lt;div id=&quot;actual-time&quot; class=&quot;actual-time&quot;&gt;&lt;/div&gt;&lt;p id=&quot;actual-clock&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;result-definition&quot;&gt;&lt;strong&gt;この日付は「暦日」です。&lt;/strong&gt;&lt;br&gt;予約画面で選ぶ日付・運行日の確定ではありません。&lt;/p&gt;&lt;div class=&quot;result-actions&quot;&gt;&lt;button id=&quot;copy&quot; class=&quot;copy&quot; type=&quot;button&quot;&gt;確認結果をコピー&lt;/button&gt;&lt;button id=&quot;edit-input&quot; class=&quot;secondary&quot; type=&quot;button&quot;&gt;条件を変更する&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;copy-status&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;button id=&quot;show-memo&quot; class=&quot;text-button memo-button&quot; type=&quot;button&quot;&gt;確認メモを表示・選択&lt;/button&gt;&lt;div id=&quot;copy-fallback&quot; hidden&gt;&lt;label for=&quot;copy-text&quot;&gt;確認メモ（選択して手動コピーできます）&lt;/label&gt;&lt;textarea id=&quot;copy-text&quot; readonly rows=&quot;8&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;figure class=&quot;result-timeline&quot;&gt;&lt;figcaption&gt;入力表記 → 暦の日時&lt;/figcaption&gt;&lt;div class=&quot;date-transition&quot;&gt;&lt;div&gt;&lt;span&gt;入力の表記&lt;/span&gt;&lt;strong id=&quot;timeline-input&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;div&gt;&lt;span id=&quot;timeline-day&quot;&gt;&lt;/span&gt;&lt;strong id=&quot;timeline-output&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;p id=&quot;timeline-explanation&quot;&gt;&lt;/p&gt;&lt;/figure&gt;&lt;div class=&quot;prep&quot;&gt;&lt;h3&gt;乗車に向けて準備する目安&lt;/h3&gt;&lt;p id=&quot;prep&quot;&gt;&lt;/p&gt;&lt;small&gt;集合時刻や自宅を出る時刻の指定ではありません。移動時間を見込んで、予約元の集合時刻に合わせてください。&lt;/small&gt;&lt;/div&gt;&lt;div id=&quot;schedule&quot; class=&quot;schedule&quot; hidden&gt;&lt;h3&gt;到着とホテルの予定&lt;/h3&gt;&lt;dl&gt;&lt;div id=&quot;arrival-row&quot;&gt;&lt;dt&gt;バス到着&lt;/dt&gt;&lt;dd id=&quot;arrival-summary&quot;&gt;&lt;/dd&gt;&lt;/div&gt;&lt;div id=&quot;hotel-row&quot;&gt;&lt;dt&gt;チェックイン&lt;/dt&gt;&lt;dd id=&quot;hotel-summary&quot;&gt;&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;p id=&quot;journey-duration&quot; class=&quot;gap&quot; hidden&gt;&lt;/p&gt;&lt;p id=&quot;gap&quot; class=&quot;gap&quot;&gt;&lt;/p&gt;&lt;small&gt;空室・荷物預かり・早めの入室の可否は、ホテルへご確認ください。&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;warning&quot;&gt;&lt;strong&gt;予約元で必ず最終確認&lt;/strong&gt;&lt;div id=&quot;warnings&quot;&gt;&lt;/div&gt;&lt;p&gt;乗車停留所の&lt;strong&gt;実際の日付・集合時刻・出発時刻・到着日&lt;/strong&gt;を、予約確認メールや乗車券と照合してください。&lt;/p&gt;&lt;/div&gt;&lt;details class=&quot;result-help&quot;&gt;&lt;summary&gt;0時・24時と「運行日」の違い&lt;/summary&gt;&lt;p&gt;同じ入力日でも、0:20はその日の午前0時20分、24:20は翌日の午前0時20分です。「翌日」の注記や会社独自の運行日は自動判定しません。&lt;/p&gt;&lt;a href=&quot;/guide#booking&quot;&gt;予約元で確認するポイント →&lt;/a&gt;&lt;/details&gt;&lt;section class=&quot;next-step&quot; aria-labelledby=&quot;next-step-title&quot;&gt;&lt;h3 id=&quot;next-step-title&quot;&gt;日時を確認したら、次の準備へ&lt;/h3&gt;&lt;p&gt;必要な項目だけ選べます。&lt;/p&gt;&lt;details&gt;&lt;summary&gt;持ち物を準備したい&lt;/summary&gt;&lt;p&gt;泊数・移動手段からリストを作る、同じ運営者の無料ツールです。&lt;/p&gt;&lt;a href=&quot;https://tabishitaku-rakuchinder.pages.dev/&quot; rel=&quot;noreferrer&quot;&gt;持ち物チェックリストへ →&lt;/a&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;宿泊の予定・料金を確認したい&lt;/summary&gt;&lt;p&gt;先に&lt;a href=&quot;/guide#hotel&quot;&gt;宿泊日・入室時間の確認ポイント&lt;/a&gt;を確認。候補が決まったら料金を手入力で比べられます。&lt;/p&gt;&lt;a href=&quot;https://rakuchin-stay.morry92.chatgpt.site/&quot; rel=&quot;noreferrer&quot;&gt;ホテル2プランの支払総額比較へ →&lt;/a&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;別のバス便と比較したい&lt;/summary&gt;&lt;a href=&quot;https://nightbus-finder.pages.dev/&quot; rel=&quot;noreferrer&quot;&gt;夜行バス2便の総額比較へ →&lt;/a&gt;&lt;/details&gt;&lt;small&gt;予定の自動転送はありません。購入・予約のページではなく、関連する無料ツールへの案内です。&lt;/small&gt;&lt;/section&gt;&lt;div class=&quot;calendar-save&quot;&gt;&lt;a id=&quot;calendar-save&quot; class=&quot;copy&quot; hidden download=&quot;night-bus-memo.ics&quot;&gt;仮の乗車メモを保存（.ics）&lt;/a&gt;&lt;p id=&quot;calendar-status&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;small&gt;予約元で日付を照合してから利用してください。30分の仮予定で、到着時刻や集合時刻ではありません。保存ファイルを対応カレンダーへ読み込みます。海外では端末設定の時差で表示されるため、日本時間と照合してください。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class=&quot;tool-sharing&quot; aria-labelledby=&quot;tool-share-title&quot;&gt;&lt;h2 id=&quot;tool-share-title&quot;&gt;夜行バスに乗る人へ、このツールを。&lt;/h2&gt;&lt;p id=&quot;tool-share-hint&quot;&gt;サービス名・説明・URLだけを共有します。入力した乗車日・時刻・ホテルの予定は含みません。&lt;/p&gt;&lt;button id=&quot;share-tool&quot; class=&quot;copy&quot; type=&quot;button&quot; aria-describedby=&quot;tool-share-hint&quot;&gt;このツールを共有&lt;/button&gt;&lt;button id=&quot;show-tool-share&quot; class=&quot;text-button&quot; type=&quot;button&quot; aria-controls=&quot;tool-share-fallback&quot;&gt;紹介文を表示・選択&lt;/button&gt;&lt;p id=&quot;tool-share-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;&lt;/p&gt;&lt;div id=&quot;tool-share-fallback&quot; hidden&gt;&lt;label for=&quot;tool-share-text&quot;&gt;サイトの紹介文（選択して手動コピーできます）&lt;/label&gt;&lt;textarea id=&quot;tool-share-text&quot; readonly rows=&quot;6&quot; spellcheck=&quot;false&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;reading&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;BEFORE YOU GO&lt;/p&gt;&lt;h2&gt;日付の境目は、この3つを確認。&lt;/h2&gt;&lt;div class=&quot;guide-cards&quot;&gt;&lt;article&gt;&lt;span class=&quot;guide-num&quot;&gt;01&lt;/span&gt;&lt;h3&gt;24時は「翌日の0時」&lt;/h3&gt;&lt;p&gt;11月7日24:20は、カレンダーでは11月8日0:20。25:10なら翌日の1:10です。&lt;/p&gt;&lt;a href=&quot;/guide#hours&quot;&gt;24時・25時表記の読み方 →&lt;/a&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;guide-num&quot;&gt;02&lt;/span&gt;&lt;h3&gt;「運行日」と日付を分ける&lt;/h3&gt;&lt;p&gt;同じ深夜の便でも、予約サイトの検索日や運行日と、実際に乗る日付が一致するとは限りません。&lt;/p&gt;&lt;a href=&quot;/guide#booking&quot;&gt;予約日の注意点 →&lt;/a&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;guide-num&quot;&gt;03&lt;/span&gt;&lt;h3&gt;ホテルは到着時刻も確認&lt;/h3&gt;&lt;p&gt;朝のバス到着とホテルの入室開始は別。宿泊日・チェックイン予定を並べて確認しましょう。&lt;/p&gt;&lt;a href=&quot;/guide#hotel&quot;&gt;遠征・宿泊の日程の整え方 →&lt;/a&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;reading&quot;&gt;&lt;h2&gt;次の遠征でも、日付確認を手早く&lt;/h2&gt;&lt;p&gt;日付はカレンダーから選べます。到着・ホテルの日付は補助ボタンで仮入力し、予約内容に合わせて修正してください。出発から到着までの時間と、到着後のチェックイン待ち時間を別々に確認できます。&lt;/p&gt;&lt;p&gt;次回も使う場合はブラウザーのブックマークに登録してください。旅行予定をサイトに保存する機能はありません。カレンダーメモに残した予定は、変更があればご自身で修正してください。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;reading&quot;&gt;&lt;h2&gt;迷いやすい表記の見比べ&lt;/h2&gt;&lt;table class=&quot;date-examples&quot;&gt;&lt;caption&gt;次の3つは同じ瞬間を示す入力例です（表記通りに換算した場合）。&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;予約画面の表記&lt;/th&gt;&lt;th&gt;実際の日本時間&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;11月7日 24:20&lt;/td&gt;&lt;td&gt;11月8日 00:20&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11月8日 00:20&lt;/td&gt;&lt;td&gt;11月8日 00:20&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11月7日 翌0:20&lt;/td&gt;&lt;td&gt;11月8日 00:20&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;「翌0:20」の場合は、計算欄には11月7日・24:20と読み替えます。「翌日」の文字をそのまま入力する機能ではありません。予約検索に使う日付は予約元へ確認してください。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;reading&quot; id=&quot;travel-preparation&quot; aria-labelledby=&quot;travel-preparation-title&quot;&gt;&lt;h2 id=&quot;travel-preparation-title&quot;&gt;日付に加えて、旅の準備も。&lt;/h2&gt;&lt;p&gt;乗車日と到着日を予約元で照合したら、必要な準備を続けられます。いずれもモーリーが運営する無料ツールです。&lt;/p&gt;&lt;div class=&quot;guide-cards&quot;&gt;&lt;article&gt;&lt;h3&gt;持ち物をそろえる&lt;/h3&gt;&lt;p&gt;泊数や移動手段から持ち物リストを作り、準備できたものをチェックできます。&lt;/p&gt;&lt;a href=&quot;https://tabishitaku-rakuchinder.pages.dev/&quot;&gt;旅行の持ち物チェックリストを作る →&lt;/a&gt;&lt;/article&gt;&lt;article&gt;&lt;h3&gt;宿泊費を比べる&lt;/h3&gt;&lt;p&gt;見つけた2プランの料金を、クーポン・使用ポイントを含む支払総額で比べます。&lt;/p&gt;&lt;a href=&quot;https://rakuchin-stay.morry92.chatgpt.site/&quot;&gt;ホテル2プランの支払総額を比較する →&lt;/a&gt;&lt;/article&gt;&lt;article&gt;&lt;h3&gt;バスの候補を比べる&lt;/h3&gt;&lt;p&gt;予約サイトで見つけた2便を手入力し、運賃と追加の移動費などを合計して比較します。&lt;/p&gt;&lt;a href=&quot;https://nightbus-finder.pages.dev/&quot;&gt;夜行バス2便の総額を手入力で比較する →&lt;/a&gt;&lt;/article&gt;&lt;/div&gt;&lt;p&gt;入力した予定は移動先に自動で引き継ぎません。日付や料金は各ツールと予約先で確認してください。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;sources&quot;&gt;&lt;h2&gt;公式の案内も、あわせて確認。&lt;/h2&gt;&lt;p&gt;表記の扱いは予約元の最新案内を優先してください。以下の内容を参照して制作しました（確認日：2026年10月23日）。&lt;/p&gt;&lt;div class=&quot;source-links&quot;&gt;&lt;a href=&quot;https://faq.willer.co.jp/s/article/1470&quot;&gt;WILLER：24時を過ぎる出発 ↗&lt;/a&gt;&lt;a href=&quot;https://www.489.fm/faq/reserve/p12.html&quot;&gt;さくら高速バス：深夜便の予約 ↗&lt;/a&gt;&lt;a href=&quot;https://www.milkyway-ex.com/news92&quot;&gt;ミルキーウェイ：出発までの流れ ↗&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;footer&gt;&lt;a class=&quot;footer-brand&quot; href=&quot;/&quot;&gt;日付まちがい防止ナビ&lt;/a&gt;&lt;nav aria-label=&quot;サイト情報&quot;&gt;&lt;a href=&quot;/guide&quot;&gt;使い方・よくある質問&lt;/a&gt;&lt;a href=&quot;/about&quot;&gt;運営・お問い合わせ&lt;/a&gt;&lt;a href=&quot;/privacy&quot;&gt;プライバシー&lt;/a&gt;&lt;a href=&quot;/terms&quot;&gt;利用上の注意&lt;/a&gt;&lt;/nav&gt;&lt;small&gt;F計画SP ｜ 日本国内の移動・日本時間（JST）に対応&lt;/small&gt;&lt;/footer&gt;&lt;/body&gt;&lt;/html&gt;"></iframe><template id="home-source">&lt;!doctype html&gt;&lt;html lang=&quot;ja&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1,viewport-fit=cover&quot;&gt;&lt;title&gt;夜行バスの24時・25時は何日？｜日付まちがい防止ナビ&lt;/title&gt;&lt;meta name=&quot;description&quot; content=&quot;夜行バスの24時・25時表記を日本時間の実際の日時に換算。乗車日と到着・ホテル予定の時間差を無料で確認。登録不要、入力した予定は端末内で処理します。&quot;&gt;&lt;meta name=&quot;google-site-verification&quot; content=&quot;EuNEpBZmHEmdZQ6MrhX1X6HME4LkcC5O2_vVCpQmz54&quot;&gt;&lt;meta name=&quot;theme-color&quot; content=&quot;#162f50&quot;&gt;&lt;link rel=&quot;canonical&quot; href=&quot;https://bus-date-navi.pages.dev/&quot;&gt;&lt;meta property=&quot;og:type&quot; content=&quot;website&quot;&gt;&lt;meta property=&quot;og:title&quot; content=&quot;夜行バスの24時・25時は何日？｜日付まちがい防止ナビ&quot;&gt;&lt;meta property=&quot;og:description&quot; content=&quot;夜行バスの24時・25時表記を日本時間の実際の日時に換算。乗車日と到着・ホテル予定の時間差を無料で確認。登録不要、入力した予定は端末内で処理します。&quot;&gt;&lt;meta property=&quot;og:url&quot; content=&quot;https://bus-date-navi.pages.dev/&quot;&gt;&lt;meta property=&quot;og:locale&quot; content=&quot;ja_JP&quot;&gt;&lt;meta name=&quot;twitter:card&quot; content=&quot;summary&quot;&gt;&lt;meta name=&quot;google-adsense-account&quot; content=&quot;ca-pub-2422278081062267&quot;&gt;&lt;link rel=&quot;icon&quot; href=&quot;/icon.svg&quot; type=&quot;image/svg+xml&quot;&gt;&lt;link rel=&quot;stylesheet&quot; href=&quot;/style.css&quot;&gt;&lt;script type=&quot;module&quot; src=&quot;/app.mjs&quot;&gt;&lt;/script&gt;&lt;/head&gt;&lt;body&gt;&lt;a class=&quot;skip&quot; href=&quot;#main&quot;&gt;本文へ移動&lt;/a&gt;&lt;header class=&quot;site-header&quot;&gt;&lt;a class=&quot;brand&quot; href=&quot;/&quot;&gt;&lt;span class=&quot;brand-mark&quot; aria-hidden=&quot;true&quot;&gt;☾&lt;/span&gt;&lt;span&gt;日付まちがい防止ナビ&lt;small&gt;NIGHT BUS · DATE CHECK&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;nav aria-label=&quot;メイン&quot;&gt;&lt;a href=&quot;/guide&quot;&gt;日付の読み方&lt;/a&gt;&lt;span class=&quot;free&quot;&gt;無料・登録不要&lt;/span&gt;&lt;/nav&gt;&lt;/header&gt;&lt;main id=&quot;main&quot;&gt;&lt;section class=&quot;hero&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;夜行バス・遠征の出発前に&lt;/p&gt;&lt;h1&gt;24時を過ぎたら、&lt;br&gt;&lt;span&gt;何日の何時？&lt;/span&gt;&lt;/h1&gt;&lt;p class=&quot;hero-lead&quot;&gt;予約画面の表記を、カレンダーの日時へ。&lt;/p&gt;&lt;div class=&quot;hero-tags&quot;&gt;&lt;span&gt;00:00〜29:59対応&lt;/span&gt;&lt;span&gt;日本時間・端末内で計算&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;boundary-example&quot;&gt;&lt;figcaption&gt;&lt;span class=&quot;example-label&quot;&gt;表記の例&lt;/span&gt; 7日24:20 ＝ 暦の8日0:20&lt;/figcaption&gt;&lt;div class=&quot;day-strip&quot;&gt;&lt;div&gt;&lt;span&gt;7日・夜&lt;/span&gt;&lt;strong&gt;23:59&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;midnight&quot;&gt;&lt;span&gt;日付が変わる&lt;/span&gt;&lt;strong&gt;8日 0:00&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;destination&quot;&gt;&lt;span&gt;7日24:20 のこと&lt;/span&gt;&lt;strong&gt;8日 0:20&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;時刻の順序を示す図です。間隔は時間に比例しません。&lt;/p&gt;&lt;/figure&gt;&lt;/section&gt;
&lt;div class=&quot;important-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;表記の変換ツールです。&lt;/strong&gt; 予約に選ぶ日付・便の運行日は予約元で確認してください。&lt;/p&gt;&lt;a href=&quot;#input-title&quot;&gt;自分の日時を確認 ↓&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;workspace&quot;&gt;&lt;section class=&quot;panel input-panel&quot; aria-labelledby=&quot;input-title&quot;&gt;&lt;div class=&quot;section-heading&quot;&gt;&lt;span class=&quot;step&quot;&gt;01&lt;/span&gt;&lt;h2 id=&quot;input-title&quot;&gt;予約画面の表記を入力&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;購入手続きした日ではなく、予約詳細にある出発日です。&lt;/p&gt;&lt;form id=&quot;check-form&quot; novalidate&gt;&lt;fieldset&gt;&lt;legend&gt;出発日時 &lt;span class=&quot;required&quot;&gt;必須&lt;/span&gt;&lt;/legend&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;departureDate&quot;&gt;表示されている出発日&lt;/label&gt;&lt;input id=&quot;departureDate&quot; name=&quot;departureDate&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：2026/11/07&quot; maxlength=&quot;24&quot; aria-describedby=&quot;departureDate-hint departureDate-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;departureDate-hint&quot;&gt;年/月/日、または年-月-日。全角でも入力できます。&lt;/small&gt;&lt;p id=&quot;departureDate-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;details class=&quot;date-picker&quot;&gt;&lt;summary&gt;カレンダーから選ぶ&lt;/summary&gt;&lt;label for=&quot;departureDate-picker&quot;&gt;表示されている出発日を選択&lt;/label&gt;&lt;input id=&quot;departureDate-picker&quot; type=&quot;date&quot; min=&quot;1900-01-01&quot; max=&quot;9998-12-31&quot; aria-describedby=&quot;departureDate-hint&quot;&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;date-shortcuts&quot;&gt;&lt;button id=&quot;use-today&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;日本時間の今日&lt;/button&gt;&lt;button id=&quot;use-tomorrow&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;日本時間の明日&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;departureTime&quot;&gt;表示されている出発時刻&lt;/label&gt;&lt;input id=&quot;departureTime&quot; name=&quot;departureTime&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：24:20&quot; maxlength=&quot;24&quot; aria-describedby=&quot;departureTime-hint departureTime-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;departureTime-hint&quot;&gt;00:00〜29:59。「翌日」の注記があるときは予約元で確認。&lt;/small&gt;&lt;p id=&quot;departureTime-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;/div&gt;&lt;/fieldset&gt;&lt;details class=&quot;sample-options&quot;&gt;&lt;summary&gt;入力例を試す&lt;/summary&gt;&lt;div class=&quot;sample-line&quot;&gt;&lt;button id=&quot;sample&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;入力例を試す：11/7 24:20&lt;/button&gt;&lt;button id=&quot;sample-year&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;年越し：12/31 25:10&lt;/button&gt;&lt;button id=&quot;sample-hotel&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;到着→ホテルの8時間待ち&lt;/button&gt;&lt;span id=&quot;sample-notice&quot; hidden&gt;入力例です。ご自身の予約に置き換えてください。&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;optional&quot;&gt;&lt;summary&gt;到着・ホテルの日程も確認する &lt;span&gt;任意&lt;/span&gt;&lt;/summary&gt;&lt;p class=&quot;muted&quot;&gt;こちらはカレンダー上の日付・00〜23時表記で入力します。分からない場合は空欄で構いません。&lt;/p&gt;&lt;fieldset&gt;&lt;legend&gt;バスの到着予定&lt;/legend&gt;&lt;button id=&quot;arrival-use-departure&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;換算後の出発日を到着日の仮入力に使う&lt;/button&gt;&lt;div class=&quot;optional-grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;arrivalDate&quot;&gt;到着予定日&lt;/label&gt;&lt;input id=&quot;arrivalDate&quot; name=&quot;arrivalDate&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：2026/11/08&quot; maxlength=&quot;24&quot; aria-describedby=&quot;arrivalDate-hint arrivalDate-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;arrivalDate-hint&quot;&gt;実際のカレンダー日付&lt;/small&gt;&lt;p id=&quot;arrivalDate-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;details class=&quot;date-picker&quot;&gt;&lt;summary&gt;カレンダーから選ぶ&lt;/summary&gt;&lt;label for=&quot;arrivalDate-picker&quot;&gt;到着予定日を選択&lt;/label&gt;&lt;input id=&quot;arrivalDate-picker&quot; type=&quot;date&quot; min=&quot;1900-01-01&quot; max=&quot;9998-12-31&quot; aria-describedby=&quot;arrivalDate-hint&quot;&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;arrivalTime&quot;&gt;到着予定時刻&lt;/label&gt;&lt;input id=&quot;arrivalTime&quot; name=&quot;arrivalTime&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：07:00&quot; maxlength=&quot;24&quot; aria-describedby=&quot;arrivalTime-hint arrivalTime-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;arrivalTime-hint&quot;&gt;00:00〜23:59&lt;/small&gt;&lt;p id=&quot;arrivalTime-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/fieldset&gt;&lt;fieldset&gt;&lt;legend&gt;ホテルのチェックイン予定&lt;/legend&gt;&lt;button id=&quot;hotel-use-arrival&quot; class=&quot;text-button&quot; type=&quot;button&quot;&gt;入力した到着日をホテル予定日に使う&lt;/button&gt;&lt;div class=&quot;optional-grid&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;hotelDate&quot;&gt;チェックイン予定日&lt;/label&gt;&lt;input id=&quot;hotelDate&quot; name=&quot;hotelDate&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：2026/11/08&quot; maxlength=&quot;24&quot; aria-describedby=&quot;hotelDate-hint hotelDate-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;hotelDate-hint&quot;&gt;予約した宿泊日の確認も必要&lt;/small&gt;&lt;p id=&quot;hotelDate-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;details class=&quot;date-picker&quot;&gt;&lt;summary&gt;カレンダーから選ぶ&lt;/summary&gt;&lt;label for=&quot;hotelDate-picker&quot;&gt;チェックイン予定日を選択&lt;/label&gt;&lt;input id=&quot;hotelDate-picker&quot; type=&quot;date&quot; min=&quot;1900-01-01&quot; max=&quot;9998-12-31&quot; aria-describedby=&quot;hotelDate-hint&quot;&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;hotelTime&quot;&gt;チェックイン予定時刻&lt;/label&gt;&lt;input id=&quot;hotelTime&quot; name=&quot;hotelTime&quot; type=&quot;text&quot; inputmode=&quot;text&quot; placeholder=&quot;例：15:00&quot; maxlength=&quot;24&quot; aria-describedby=&quot;hotelTime-hint hotelTime-error&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;small id=&quot;hotelTime-hint&quot;&gt;00:00〜23:59&lt;/small&gt;&lt;p id=&quot;hotelTime-error&quot; class=&quot;field-error&quot; hidden&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/fieldset&gt;&lt;/details&gt;&lt;p id=&quot;date-input-status&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;div id=&quot;form-error&quot; class=&quot;error&quot; role=&quot;alert&quot; hidden&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; type=&quot;submit&quot;&gt;乗車日時を確認する &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;reset&quot; id=&quot;clear-input&quot; type=&quot;button&quot;&gt;入力をすべて消す&lt;/button&gt;&lt;p class=&quot;local-note&quot;&gt;予約番号・名前の入力は不要。&lt;br&gt;このフォームの予定は外部へ送信しません。&lt;/p&gt;&lt;/form&gt;&lt;noscript&gt;&lt;p class=&quot;error&quot;&gt;計算にはJavaScriptを有効にしてください。日付の読み方は下のガイドで確認できます。&lt;/p&gt;&lt;/noscript&gt;&lt;/section&gt;
&lt;section class=&quot;panel result-panel&quot; aria-label=&quot;確認結果&quot;&gt;&lt;div class=&quot;section-heading&quot;&gt;&lt;span class=&quot;step light&quot;&gt;02&lt;/span&gt;&lt;h2&gt;カレンダー上の日時を確認&lt;/h2&gt;&lt;/div&gt;&lt;div id=&quot;empty-result&quot; class=&quot;empty-result&quot;&gt;&lt;span class=&quot;empty-mark&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;h3&gt;ご自身の日時は、まだ未計算です&lt;/h3&gt;&lt;p&gt;出発日と時刻を入力し、&lt;br&gt;「乗車日時を確認する」を押してください。&lt;/p&gt;&lt;p class=&quot;empty-note&quot;&gt;上の時刻帯は説明用の例です。&lt;/p&gt;&lt;/div&gt;
&lt;div id=&quot;result&quot; hidden&gt;&lt;p id=&quot;result-kind&quot; class=&quot;result-kind&quot;&gt;&lt;/p&gt;&lt;p class=&quot;result-input&quot;&gt;予約画面の入力 &lt;strong id=&quot;input-summary&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;div class=&quot;actual&quot;&gt;&lt;span id=&quot;rollover&quot; class=&quot;rollover&quot;&gt;&lt;/span&gt;&lt;h3 id=&quot;result-title&quot; tabindex=&quot;-1&quot;&gt;カレンダー上の出発日時&lt;/h3&gt;&lt;div id=&quot;actual-date&quot; class=&quot;actual-date&quot;&gt;&lt;/div&gt;&lt;div id=&quot;actual-time&quot; class=&quot;actual-time&quot;&gt;&lt;/div&gt;&lt;p id=&quot;actual-clock&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;result-definition&quot;&gt;&lt;strong&gt;この日付は「暦日」です。&lt;/strong&gt;&lt;br&gt;予約画面で選ぶ日付・運行日の確定ではありません。&lt;/p&gt;&lt;div class=&quot;result-actions&quot;&gt;&lt;button id=&quot;copy&quot; class=&quot;copy&quot; type=&quot;button&quot;&gt;確認結果をコピー&lt;/button&gt;&lt;button id=&quot;edit-input&quot; class=&quot;secondary&quot; type=&quot;button&quot;&gt;条件を変更する&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;copy-status&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;button id=&quot;show-memo&quot; class=&quot;text-button memo-button&quot; type=&quot;button&quot;&gt;確認メモを表示・選択&lt;/button&gt;&lt;div id=&quot;copy-fallback&quot; hidden&gt;&lt;label for=&quot;copy-text&quot;&gt;確認メモ（選択して手動コピーできます）&lt;/label&gt;&lt;textarea id=&quot;copy-text&quot; readonly rows=&quot;8&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;figure class=&quot;result-timeline&quot;&gt;&lt;figcaption&gt;入力表記 → 暦の日時&lt;/figcaption&gt;&lt;div class=&quot;date-transition&quot;&gt;&lt;div&gt;&lt;span&gt;入力の表記&lt;/span&gt;&lt;strong id=&quot;timeline-input&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;div&gt;&lt;span id=&quot;timeline-day&quot;&gt;&lt;/span&gt;&lt;strong id=&quot;timeline-output&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;p id=&quot;timeline-explanation&quot;&gt;&lt;/p&gt;&lt;/figure&gt;&lt;div class=&quot;prep&quot;&gt;&lt;h3&gt;乗車に向けて準備する目安&lt;/h3&gt;&lt;p id=&quot;prep&quot;&gt;&lt;/p&gt;&lt;small&gt;集合時刻や自宅を出る時刻の指定ではありません。移動時間を見込んで、予約元の集合時刻に合わせてください。&lt;/small&gt;&lt;/div&gt;&lt;div id=&quot;schedule&quot; class=&quot;schedule&quot; hidden&gt;&lt;h3&gt;到着とホテルの予定&lt;/h3&gt;&lt;dl&gt;&lt;div id=&quot;arrival-row&quot;&gt;&lt;dt&gt;バス到着&lt;/dt&gt;&lt;dd id=&quot;arrival-summary&quot;&gt;&lt;/dd&gt;&lt;/div&gt;&lt;div id=&quot;hotel-row&quot;&gt;&lt;dt&gt;チェックイン&lt;/dt&gt;&lt;dd id=&quot;hotel-summary&quot;&gt;&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;p id=&quot;journey-duration&quot; class=&quot;gap&quot; hidden&gt;&lt;/p&gt;&lt;p id=&quot;gap&quot; class=&quot;gap&quot;&gt;&lt;/p&gt;&lt;small&gt;空室・荷物預かり・早めの入室の可否は、ホテルへご確認ください。&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;warning&quot;&gt;&lt;strong&gt;予約元で必ず最終確認&lt;/strong&gt;&lt;div id=&quot;warnings&quot;&gt;&lt;/div&gt;&lt;p&gt;乗車停留所の&lt;strong&gt;実際の日付・集合時刻・出発時刻・到着日&lt;/strong&gt;を、予約確認メールや乗車券と照合してください。&lt;/p&gt;&lt;/div&gt;&lt;details class=&quot;result-help&quot;&gt;&lt;summary&gt;0時・24時と「運行日」の違い&lt;/summary&gt;&lt;p&gt;同じ入力日でも、0:20はその日の午前0時20分、24:20は翌日の午前0時20分です。「翌日」の注記や会社独自の運行日は自動判定しません。&lt;/p&gt;&lt;a href=&quot;/guide#booking&quot;&gt;予約元で確認するポイント →&lt;/a&gt;&lt;/details&gt;&lt;section class=&quot;next-step&quot; aria-labelledby=&quot;next-step-title&quot;&gt;&lt;h3 id=&quot;next-step-title&quot;&gt;日時を確認したら、次の準備へ&lt;/h3&gt;&lt;p&gt;必要な項目だけ選べます。&lt;/p&gt;&lt;details&gt;&lt;summary&gt;持ち物を準備したい&lt;/summary&gt;&lt;p&gt;泊数・移動手段からリストを作る、同じ運営者の無料ツールです。&lt;/p&gt;&lt;a href=&quot;https://tabishitaku-rakuchinder.pages.dev/&quot; rel=&quot;noreferrer&quot;&gt;持ち物チェックリストへ →&lt;/a&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;宿泊の予定・料金を確認したい&lt;/summary&gt;&lt;p&gt;先に&lt;a href=&quot;/guide#hotel&quot;&gt;宿泊日・入室時間の確認ポイント&lt;/a&gt;を確認。候補が決まったら料金を手入力で比べられます。&lt;/p&gt;&lt;a href=&quot;https://rakuchin-stay.morry92.chatgpt.site/&quot; rel=&quot;noreferrer&quot;&gt;ホテル2プランの支払総額比較へ →&lt;/a&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;別のバス便と比較したい&lt;/summary&gt;&lt;a href=&quot;https://nightbus-finder.pages.dev/&quot; rel=&quot;noreferrer&quot;&gt;夜行バス2便の総額比較へ →&lt;/a&gt;&lt;/details&gt;&lt;small&gt;予定の自動転送はありません。購入・予約のページではなく、関連する無料ツールへの案内です。&lt;/small&gt;&lt;/section&gt;&lt;div class=&quot;calendar-save&quot;&gt;&lt;a id=&quot;calendar-save&quot; class=&quot;copy&quot; hidden download=&quot;night-bus-memo.ics&quot;&gt;仮の乗車メモを保存（.ics）&lt;/a&gt;&lt;p id=&quot;calendar-status&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;small&gt;予約元で日付を照合してから利用してください。30分の仮予定で、到着時刻や集合時刻ではありません。保存ファイルを対応カレンダーへ読み込みます。海外では端末設定の時差で表示されるため、日本時間と照合してください。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class=&quot;tool-sharing&quot; aria-labelledby=&quot;tool-share-title&quot;&gt;&lt;h2 id=&quot;tool-share-title&quot;&gt;夜行バスに乗る人へ、このツールを。&lt;/h2&gt;&lt;p id=&quot;tool-share-hint&quot;&gt;サービス名・説明・URLだけを共有します。入力した乗車日・時刻・ホテルの予定は含みません。&lt;/p&gt;&lt;button id=&quot;share-tool&quot; class=&quot;copy&quot; type=&quot;button&quot; aria-describedby=&quot;tool-share-hint&quot;&gt;このツールを共有&lt;/button&gt;&lt;button id=&quot;show-tool-share&quot; class=&quot;text-button&quot; type=&quot;button&quot; aria-controls=&quot;tool-share-fallback&quot;&gt;紹介文を表示・選択&lt;/button&gt;&lt;p id=&quot;tool-share-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;&lt;/p&gt;&lt;div id=&quot;tool-share-fallback&quot; hidden&gt;&lt;label for=&quot;tool-share-text&quot;&gt;サイトの紹介文（選択して手動コピーできます）&lt;/label&gt;&lt;textarea id=&quot;tool-share-text&quot; readonly rows=&quot;6&quot; spellcheck=&quot;false&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;reading&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;BEFORE YOU GO&lt;/p&gt;&lt;h2&gt;日付の境目は、この3つを確認。&lt;/h2&gt;&lt;div class=&quot;guide-cards&quot;&gt;&lt;article&gt;&lt;span class=&quot;guide-num&quot;&gt;01&lt;/span&gt;&lt;h3&gt;24時は「翌日の0時」&lt;/h3&gt;&lt;p&gt;11月7日24:20は、カレンダーでは11月8日0:20。25:10なら翌日の1:10です。&lt;/p&gt;&lt;a href=&quot;/guide#hours&quot;&gt;24時・25時表記の読み方 →&lt;/a&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;guide-num&quot;&gt;02&lt;/span&gt;&lt;h3&gt;「運行日」と日付を分ける&lt;/h3&gt;&lt;p&gt;同じ深夜の便でも、予約サイトの検索日や運行日と、実際に乗る日付が一致するとは限りません。&lt;/p&gt;&lt;a href=&quot;/guide#booking&quot;&gt;予約日の注意点 →&lt;/a&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;guide-num&quot;&gt;03&lt;/span&gt;&lt;h3&gt;ホテルは到着時刻も確認&lt;/h3&gt;&lt;p&gt;朝のバス到着とホテルの入室開始は別。宿泊日・チェックイン予定を並べて確認しましょう。&lt;/p&gt;&lt;a href=&quot;/guide#hotel&quot;&gt;遠征・宿泊の日程の整え方 →&lt;/a&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;reading&quot;&gt;&lt;h2&gt;次の遠征でも、日付確認を手早く&lt;/h2&gt;&lt;p&gt;日付はカレンダーから選べます。到着・ホテルの日付は補助ボタンで仮入力し、予約内容に合わせて修正してください。出発から到着までの時間と、到着後のチェックイン待ち時間を別々に確認できます。&lt;/p&gt;&lt;p&gt;次回も使う場合はブラウザーのブックマークに登録してください。旅行予定をサイトに保存する機能はありません。カレンダーメモに残した予定は、変更があればご自身で修正してください。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;reading&quot;&gt;&lt;h2&gt;迷いやすい表記の見比べ&lt;/h2&gt;&lt;table class=&quot;date-examples&quot;&gt;&lt;caption&gt;次の3つは同じ瞬間を示す入力例です（表記通りに換算した場合）。&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;予約画面の表記&lt;/th&gt;&lt;th&gt;実際の日本時間&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;11月7日 24:20&lt;/td&gt;&lt;td&gt;11月8日 00:20&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11月8日 00:20&lt;/td&gt;&lt;td&gt;11月8日 00:20&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11月7日 翌0:20&lt;/td&gt;&lt;td&gt;11月8日 00:20&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;「翌0:20」の場合は、計算欄には11月7日・24:20と読み替えます。「翌日」の文字をそのまま入力する機能ではありません。予約検索に使う日付は予約元へ確認してください。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;reading&quot; id=&quot;travel-preparation&quot; aria-labelledby=&quot;travel-preparation-title&quot;&gt;&lt;h2 id=&quot;travel-preparation-title&quot;&gt;日付に加えて、旅の準備も。&lt;/h2&gt;&lt;p&gt;乗車日と到着日を予約元で照合したら、必要な準備を続けられます。いずれもモーリーが運営する無料ツールです。&lt;/p&gt;&lt;div class=&quot;guide-cards&quot;&gt;&lt;article&gt;&lt;h3&gt;持ち物をそろえる&lt;/h3&gt;&lt;p&gt;泊数や移動手段から持ち物リストを作り、準備できたものをチェックできます。&lt;/p&gt;&lt;a href=&quot;https://tabishitaku-rakuchinder.pages.dev/&quot;&gt;旅行の持ち物チェックリストを作る →&lt;/a&gt;&lt;/article&gt;&lt;article&gt;&lt;h3&gt;宿泊費を比べる&lt;/h3&gt;&lt;p&gt;見つけた2プランの料金を、クーポン・使用ポイントを含む支払総額で比べます。&lt;/p&gt;&lt;a href=&quot;https://rakuchin-stay.morry92.chatgpt.site/&quot;&gt;ホテル2プランの支払総額を比較する →&lt;/a&gt;&lt;/article&gt;&lt;article&gt;&lt;h3&gt;バスの候補を比べる&lt;/h3&gt;&lt;p&gt;予約サイトで見つけた2便を手入力し、運賃と追加の移動費などを合計して比較します。&lt;/p&gt;&lt;a href=&quot;https://nightbus-finder.pages.dev/&quot;&gt;夜行バス2便の総額を手入力で比較する →&lt;/a&gt;&lt;/article&gt;&lt;/div&gt;&lt;p&gt;入力した予定は移動先に自動で引き継ぎません。日付や料金は各ツールと予約先で確認してください。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;sources&quot;&gt;&lt;h2&gt;公式の案内も、あわせて確認。&lt;/h2&gt;&lt;p&gt;表記の扱いは予約元の最新案内を優先してください。以下の内容を参照して制作しました（確認日：2026年10月23日）。&lt;/p&gt;&lt;div class=&quot;source-links&quot;&gt;&lt;a href=&quot;https://faq.willer.co.jp/s/article/1470&quot;&gt;WILLER：24時を過ぎる出発 ↗&lt;/a&gt;&lt;a href=&quot;https://www.489.fm/faq/reserve/p12.html&quot;&gt;さくら高速バス：深夜便の予約 ↗&lt;/a&gt;&lt;a href=&quot;https://www.milkyway-ex.com/news92&quot;&gt;ミルキーウェイ：出発までの流れ ↗&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;footer&gt;&lt;a class=&quot;footer-brand&quot; href=&quot;/&quot;&gt;日付まちがい防止ナビ&lt;/a&gt;&lt;nav aria-label=&quot;サイト情報&quot;&gt;&lt;a href=&quot;/guide&quot;&gt;使い方・よくある質問&lt;/a&gt;&lt;a href=&quot;/about&quot;&gt;運営・お問い合わせ&lt;/a&gt;&lt;a href=&quot;/privacy&quot;&gt;プライバシー&lt;/a&gt;&lt;a href=&quot;/terms&quot;&gt;利用上の注意&lt;/a&gt;&lt;/nav&gt;&lt;small&gt;F計画SP ｜ 日本国内の移動・日本時間（JST）に対応&lt;/small&gt;&lt;/footer&gt;&lt;/body&gt;&lt;/html&gt;</template><template id="guide-source">&lt;!doctype html&gt;&lt;html lang=&quot;ja&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1,viewport-fit=cover&quot;&gt;&lt;title&gt;夜行バスの24時・25時と予約日の読み方｜日付まちがい防止ナビ&lt;/title&gt;&lt;meta name=&quot;description&quot; content=&quot;24時以降の乗車日、年越し・月末・ライブ遠征・ホテルの日程確認を具体例と公式案内で解説。&quot;&gt;&lt;meta name=&quot;theme-color&quot; content=&quot;#162f50&quot;&gt;&lt;link rel=&quot;canonical&quot; href=&quot;https://bus-date-navi.pages.dev/guide&quot;&gt;&lt;meta property=&quot;og:type&quot; content=&quot;website&quot;&gt;&lt;meta property=&quot;og:title&quot; content=&quot;夜行バスの24時・25時と予約日の読み方｜日付まちがい防止ナビ&quot;&gt;&lt;meta property=&quot;og:description&quot; content=&quot;24時以降の乗車日、年越し・月末・ライブ遠征・ホテルの日程確認を具体例と公式案内で解説。&quot;&gt;&lt;meta property=&quot;og:url&quot; content=&quot;https://bus-date-navi.pages.dev/guide&quot;&gt;&lt;meta property=&quot;og:locale&quot; content=&quot;ja_JP&quot;&gt;&lt;meta name=&quot;twitter:card&quot; content=&quot;summary&quot;&gt;&lt;meta name=&quot;google-adsense-account&quot; content=&quot;ca-pub-2422278081062267&quot;&gt;&lt;link rel=&quot;icon&quot; href=&quot;/icon.svg&quot; type=&quot;image/svg+xml&quot;&gt;&lt;link rel=&quot;stylesheet&quot; href=&quot;/style.css&quot;&gt;&lt;/head&gt;&lt;body&gt;&lt;a class=&quot;skip&quot; href=&quot;#main&quot;&gt;本文へ移動&lt;/a&gt;&lt;header class=&quot;site-header&quot;&gt;&lt;a class=&quot;brand&quot; href=&quot;/&quot;&gt;&lt;span class=&quot;brand-mark&quot; aria-hidden=&quot;true&quot;&gt;☾&lt;/span&gt;&lt;span&gt;日付まちがい防止ナビ&lt;small&gt;NIGHT BUS · DATE CHECK&lt;/small&gt;&lt;/span&gt;&lt;/a&gt;&lt;nav aria-label=&quot;メイン&quot;&gt;&lt;a href=&quot;/guide&quot;&gt;日付の読み方&lt;/a&gt;&lt;span class=&quot;free&quot;&gt;無料・登録不要&lt;/span&gt;&lt;/nav&gt;&lt;/header&gt;&lt;main id=&quot;main&quot; class=&quot;document&quot;&gt;&lt;a class=&quot;back&quot; href=&quot;/&quot;&gt;← 日時チェックへ&lt;/a&gt;&lt;h1&gt;夜行バスの24時・25時は何日？&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;&lt;strong&gt;11月7日24:20は11月8日午前0時20分、11月7日25:10は11月8日午前1時10分です。&lt;/strong&gt; 夜行バスの表記から実際の乗車日時を確かめたら、予約画面で選ぶ日と乗り場の集合時刻も予約元で照合しましょう。&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;primary-link&quot; href=&quot;/&quot;&gt;自分の乗車日時を確認する →&lt;/a&gt;&lt;/p&gt;&lt;nav class=&quot;toc&quot; aria-label=&quot;目次&quot;&gt;&lt;a href=&quot;#hours&quot;&gt;24時・25時とは&lt;/a&gt;&lt;a href=&quot;#booking&quot;&gt;予約日との違い&lt;/a&gt;&lt;a href=&quot;#borders&quot;&gt;月末・年越し&lt;/a&gt;&lt;a href=&quot;#event&quot;&gt;ライブ遠征&lt;/a&gt;&lt;a href=&quot;#hotel&quot;&gt;ホテルの予定&lt;/a&gt;&lt;a href=&quot;#faq&quot;&gt;よくある質問&lt;/a&gt;&lt;/nav&gt;
&lt;section id=&quot;hours&quot;&gt;&lt;figure class=&quot;boundary-example&quot;&gt;&lt;figcaption&gt;&lt;span class=&quot;example-label&quot;&gt;表記の例&lt;/span&gt; 7日24:20 ＝ 暦の8日0:20&lt;/figcaption&gt;&lt;div class=&quot;day-strip&quot;&gt;&lt;div&gt;&lt;span&gt;7日・夜&lt;/span&gt;&lt;strong&gt;23:59&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;midnight&quot;&gt;&lt;span&gt;日付が変わる&lt;/span&gt;&lt;strong&gt;8日 0:00&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;destination&quot;&gt;&lt;span&gt;7日24:20 のこと&lt;/span&gt;&lt;strong&gt;8日 0:20&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;時刻の順序を示す図です。間隔は時間に比例しません。&lt;/p&gt;&lt;/figure&gt;&lt;h2&gt;夜行バスの24時・25時表記とは&lt;/h2&gt;&lt;p&gt;24:00は翌日の00:00、24:30は翌日の00:30、25:00は翌日の01:00を表します。「7日の24時」は7日の夜が終わって8日に切り替わる瞬間です。8日の夜まで待つと、丸1日違います。&lt;/p&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;caption&gt;2026年11月7日の表記を変換すると&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;入力する表記&lt;/th&gt;&lt;th&gt;カレンダー上の日時（JST）&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;11月7日 23:59&lt;/td&gt;&lt;td&gt;11月7日（土）午後11時59分&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11月7日 24:00&lt;/td&gt;&lt;td&gt;11月8日（日）午前0時00分&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11月7日 24:30&lt;/td&gt;&lt;td&gt;11月8日（日）午前0時30分&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11月7日 25:00&lt;/td&gt;&lt;td&gt;11月8日（日）午前1時00分&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p&gt;このツールは出発時刻00:00〜29:59に対応します。30:00や24:60を別の時刻へ直すことはせず、エラーを表示します。&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;booking&quot;&gt;&lt;h2&gt;予約日と、実際の乗車日の違い&lt;/h2&gt;&lt;p&gt;ここでいう「予約画面の出発日」は購入・決済した日ではありません。予約詳細や乗車券に書かれた出発日を確認してください。夜行便では、日付が変わった後の停留所でも、前日から始まる便として案内される場合があります。&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://faq.willer.co.jp/s/article/1470&quot;&gt;WILLER公式FAQ&lt;/a&gt;は夜行便の検索・予約日を到着日の前日とし、12月31日25時の便には1月1日午前1時に乗る例を示しています。&lt;a href=&quot;https://www.489.fm/faq/reserve/p12.html&quot;&gt;さくら高速バス公式FAQ&lt;/a&gt;も24時を過ぎる便について前日を選択し、最終画面の到着日を確認するよう案内しています。&lt;a href=&quot;https://www.milkyway-ex.com/news92&quot;&gt;ミルキーウェイ公式案内&lt;/a&gt;でも夜行便の検索日を到着日の前日と説明しています。&lt;/p&gt;&lt;div class=&quot;warning&quot;&gt;&lt;strong&gt;この案内をすべての会社へ当てはめないでください。&lt;/strong&gt;&lt;p&gt;予約サイトによって日付の扱いや「翌日」の表示が異なります。11月7日00:20という入力は、このツールでは11月7日午前0時20分として計算しますが、便の運行日まで確定できません。「11月7日運行・翌日00:20」のような記載なら、予約元で実際の日時を確認してください。&lt;/p&gt;&lt;/div&gt;&lt;p&gt;出発地を途中の停留所に変更した場合も、自分の乗車停留所の日時を見直しましょう。始発地の日付だけで判断しないことが大切です。&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;borders&quot;&gt;&lt;h2&gt;月またぎ・年越しの具体例&lt;/h2&gt;&lt;p&gt;24時以降の変換では、日付だけでなく月・年も進むことがあります。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;2026年11月30日24:20 → 2026年12月1日午前0時20分&lt;/li&gt;&lt;li&gt;2026年12月31日24:15 → 2027年1月1日午前0時15分&lt;/li&gt;&lt;li&gt;2028年2月28日24:30 → 2028年2月29日午前0時30分（うるう年）&lt;/li&gt;&lt;li&gt;2027年2月28日24:30 → 2027年3月1日午前0時30分&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;月末をまたぐ遠征では、バスとホテルを同じ月のカレンダーだけで見ないようにしましょう。このツールは日本時間で計算し、端末の海外時間設定に合わせた変換はしません。&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;event&quot;&gt;&lt;h2&gt;ライブ遠征では「行き」と「帰り」を別々に確認&lt;/h2&gt;&lt;p&gt;11月8日の朝に到着する予定で、予約画面が11月7日24:20発なら、準備する目安は7日の夜です。一方、8日のライブが終わった後の11月8日24:20発は、カレンダーでは9日午前0時20分です。行きと帰りで同じ「24:20」でも、乗車する日は異なります。&lt;/p&gt;&lt;ol&gt;&lt;li&gt;公演日と開場・開演時刻を確認する。&lt;/li&gt;&lt;li&gt;行きの到着日と、公演会場までの移動時間を整理する。&lt;/li&gt;&lt;li&gt;帰りは公演の終了予定と、乗車場所・集合時刻を別に確認する。&lt;/li&gt;&lt;li&gt;行き・帰りそれぞれで日時を入力し、確認メモを残す。&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;道路の混雑や公演の延長はこのツールでは予測しません。「予定上間に合う」ことと実際の到着保証は別です。&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;hotel&quot;&gt;&lt;h2&gt;到着日とホテルのチェックイン日を整理する&lt;/h2&gt;&lt;p&gt;11月8日7:00にバスが到着し、ホテルのチェックイン予定が同日15:00なら、時間差は8時間です。この8時間は予定の差であり、待機場所や早めに入室できることを保証する数字ではありません。&lt;/p&gt;&lt;p&gt;任意欄には、実際のカレンダー日付と00〜23時表記の時刻を入力してください。ホテルが「7日宿泊・チェックイン25時」のように案内している場合は、実際の入館予定が8日1時であるかホテルに確認し、日付・時刻を合わせて入力します。&lt;/p&gt;&lt;p&gt;チェックインがバス到着より前でも、前泊の部屋を確保しているなど意図した予約かもしれません。自動的に予約ミスとは判断しません。宿泊日、深夜到着時の連絡、荷物預かり、アーリーチェックインの可否は、施設ごとに確認してください。&lt;/p&gt;&lt;p&gt;宿泊日を確かめたら、&lt;a href=&quot;https://rakuchin-stay.morry92.chatgpt.site/&quot;&gt;ホテル2プランの支払総額を比較&lt;/a&gt;できます。出発前の荷物は、&lt;a href=&quot;https://tabishitaku-rakuchinder.pages.dev/&quot;&gt;泊数・移動手段別の持ち物チェックリスト&lt;/a&gt;で整理できます。入力した予定は外部へ自動転送しません。&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;faq&quot;&gt;&lt;h2&gt;よくある質問&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;この結果の日付でバスを予約すればよいですか？&lt;/summary&gt;&lt;p&gt;いいえ。結果は入力表記のカレンダー換算です。検索・予約に選ぶ日付や便の運行日は、予約サイトの案内に従ってください。&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;0:20と24:20は同じですか？&lt;/summary&gt;&lt;p&gt;同じ入力日なら1日異なります。11月7日0:20は7日午前0時20分、11月7日24:20は8日午前0時20分です。ただし予約画面の「翌日」注記などは本ツールでは読み取れません。&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;全角文字でも入力できますか？&lt;/summary&gt;&lt;p&gt;２０２６／１１／０７、２４：２０のような全角数字・区切り文字に対応します。年月日は「2026/11/07」、時刻は「24:20」の形にしてください。不正な日付や分は補正しません。&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;入力した予定は保存・送信されますか？&lt;/summary&gt;&lt;p&gt;旅行予定をサーバーへ送信する機能や保存機能はありません。コピーした確認メモは端末のクリップボードに入ります。共有先はご自身で選んでください。&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;確認結果をコピーできない場合は？&lt;/summary&gt;&lt;p&gt;ブラウザーの制限などで失敗した場合は、選択できる確認メモを表示します。「確認メモを表示・選択」から手動コピーすることもできます。&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;海外のバスにも使えますか？&lt;/summary&gt;&lt;p&gt;日本国内の予定・日本時間（JST）専用です。海外の現地時間や夏時間には対応していません。&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;&lt;p class=&quot;updated&quot;&gt;内容更新：2026年11月12日 · 既存の公式案内参照：2026年10月23日&lt;/p&gt;&lt;/main&gt;&lt;footer&gt;&lt;a class=&quot;footer-brand&quot; href=&quot;/&quot;&gt;日付まちがい防止ナビ&lt;/a&gt;&lt;nav aria-label=&quot;サイト情報&quot;&gt;&lt;a href=&quot;/guide&quot;&gt;使い方・よくある質問&lt;/a&gt;&lt;a href=&quot;/about&quot;&gt;運営・お問い合わせ&lt;/a&gt;&lt;a href=&quot;/privacy&quot;&gt;プライバシー&lt;/a&gt;&lt;a href=&quot;/terms&quot;&gt;利用上の注意&lt;/a&gt;&lt;/nav&gt;&lt;small&gt;F計画SP ｜ 日本国内の移動・日本時間（JST）に対応&lt;/small&gt;&lt;/footer&gt;&lt;/body&gt;&lt;/html&gt;</template></body></html>
